name: effect-cicd-demo

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: effect_cicd
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d effect_cicd"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-access
      MINIO_ROOT_PASSWORD: minio-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot init to create the required bucket for ArtifactStore.
  minio-init:
    image: alpine:3.20
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: minio-access
      MINIO_ROOT_PASSWORD: minio-secret
      S3_BUCKET: effect-cicd-artifacts
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apk add --no-cache ca-certificates >/dev/null
        wget -qO /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc || wget -qO /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-arm64/mc
        chmod +x /usr/local/bin/mc
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET" >/dev/null
        echo "minio bucket ready: $$S3_BUCKET"

volumes:
  postgres-data:
  minio-data:
